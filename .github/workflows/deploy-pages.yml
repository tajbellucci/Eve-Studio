name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/creative-studio-awwwards-site-48nhbo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Publishing to the gh-pages branch auto-enables GitHub Pages for the
      # repo, so no manual Settings → Pages step is needed. The action also
      # drops a .nojekyll file so the _next/ directory is served as-is.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
